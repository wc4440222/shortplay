allprojects {
    repositories {
        // 国内网络优先走阿里云镜像，google()/mavenCentral() 作为兜底。
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Workaround: set namespace for Android library subprojects (plugins) missing it (AGP 8 requirement)
subprojects { subproject ->
    subproject.plugins.withId("com.android.library") {
        def androidExt = subproject.extensions.findByName("android")
        if (androidExt != null) {
            try {
                def hasNsProp = androidExt.hasProperty('namespace')
                def ns = hasNsProp ? androidExt.namespace : null
                if (!hasNsProp || ns == null || ns.toString().trim().isEmpty()) {
                    androidExt.namespace = "com.${subproject.name.replace('-', '_')}"
                }
            } catch (Throwable ignored) {
                // Older AGP may not expose namespace; ignore
            }
        }
    }
}


tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
