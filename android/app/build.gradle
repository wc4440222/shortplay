plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.shortplay"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }


    // 大嘴短剧 OEM 版自有签名：keystore 与口令放在 android/key.properties（已 gitignore）
    signingConfigs {
        create("release") {
            def props = new Properties()
            def f = rootProject.file("key.properties")
            if (f.exists()) {
                props.load(new FileInputStream(f))
                storeFile = rootProject.file(props.getProperty("storeFile"))
                storePassword = props.getProperty("storePassword")
                keyAlias = props.getProperty("keyAlias")
                keyPassword = props.getProperty("keyPassword")
            }
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.dazui.shortplay"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        // Android 使用独立版本号，iOS 继续使用 pubspec.yaml 中的版本。
        versionName = "3.2.2-dazui"
    }

    // 支持 arm64-v8a 和 armeabi-v7a（32 位：老手机和大量电视盒子）。
    // 自研 .so 在 src/main/jniLibs/<abi>/ 下，两个架构都要有。
    //
    // 注意：defaultConfig.ndk.abiFilters 对 Flutter 无效——Flutter 的 gradle
    // 插件会在其后重新注入全部 ABI 的引擎库（libflutter/libapp 等），覆盖掉
    // 过滤。必须用 packagingOptions.jniLibs.excludes，它在打包最后阶段按路径
    // 排除，对所有 .so（含引擎库）都生效。
    //
    // ⚠️ namespace 必须保持 com.example.shortplay：预编译的
    // libshortplay_crypto.so 里 JNI 符号写死为
    // Java_com_example_shortplay_CryptoNative_*，改了包名会导致
    // UnsatisfiedLinkError，播放时直接闪退。
    // 需要换安装包名时只改 applicationId，不要动 namespace 和 Kotlin 包名。
    //
    // 发布时用 `flutter build apk --split-per-abi` 按架构拆成两个 APK，
    // 各自体积与原来单架构包相当；不拆的话一个包同时含 32/64 位，体积更大。
    // 如需 x86 模拟器，去掉 "**/x86/**" 与 "**/x86_64/**"（还需编译对应 .so）。
    packagingOptions {
        jniLibs {
            excludes += [
                "**/x86/**",
                "**/x86_64/**",
            ]
        }
    }

    buildTypes {
        release {
            // 大嘴短剧 OEM 版：使用自有 keystore 签名（android/key.properties）
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // OkHttp powers HttpBridge.httpRange, the range fetcher the native crypto
    // core calls back into. Declared explicitly rather than relying on a
    // transitive copy from media_kit.
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    // Media3 ExoPlayer — NativePlayerPlugin 使用，替代 media_kit 的原生播放器实现
    def media3_version = "1.4.1"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"
    implementation "androidx.media3:media3-datasource:$media3_version"
}
